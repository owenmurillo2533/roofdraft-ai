<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoofDraft AI — Professional Roofing Proposals in 60 Seconds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --card: #111111;
      --card2: #161616;
      --orange: #E8500A;
      --orange-hover: #d44408;
      --white: #f5f0eb;
      --muted: #888888;
      --border: rgba(255,255,255,0.08);
      --radius: 8px;
    }

    html, body, #root { height: 100%; }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }

    a { color: var(--orange); text-decoration: none; }

    ::selection { background: var(--orange); color: #fff; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    /* ---- Buttons ---- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.18s ease;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--orange);
      color: #fff;
    }
    .btn-primary:hover { background: var(--orange-hover); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-ghost {
      background: transparent;
      color: var(--white);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.04); }
    .btn-outline-orange {
      background: transparent;
      color: var(--orange);
      border: 1px solid var(--orange);
    }
    .btn-outline-orange:hover { background: rgba(232,80,10,0.08); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
    .btn-full { width: 100%; }

    /* ---- Form elements ---- */
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-input, .form-select, .form-textarea {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      padding: 10px 14px;
      transition: border-color 0.15s;
      outline: none;
      width: 100%;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--orange);
    }
    .form-input::placeholder, .form-textarea::placeholder { color: #444; }
    .form-select { appearance: none; cursor: pointer; }
    .form-select option { background: #1a1a1a; }
    .form-textarea { resize: vertical; min-height: 80px; }

    /* ---- Modal overlay ---- */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }
    .modal-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
    }
    .modal-subtitle { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
    .modal-form { display: flex; flex-direction: column; gap: 16px; }
    .modal-error {
      background: rgba(220,38,38,0.1);
      border: 1px solid rgba(220,38,38,0.3);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 13px;
      color: #f87171;
    }
    .modal-switch {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-top: 16px;
    }
    .modal-switch button {
      background: none; border: none; color: var(--orange); cursor: pointer;
      font-size: 13px; padding: 0; font-family: 'DM Sans', sans-serif;
    }
    .modal-switch button:hover { text-decoration: underline; }

    /* ---- Spinner ---- */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Dashboard layout ---- */
    .dashboard {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ---- Sidebar ---- */
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar-logo {
      padding: 24px 20px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-logo-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 0.04em;
      color: var(--white);
    }
    .sidebar-logo-text span { color: var(--orange); }
    .sidebar-nav {
      flex: 1;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      transition: all 0.15s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--white); }
    .nav-item.active { background: rgba(232,80,10,0.12); color: var(--orange); }
    .nav-icon { width: 16px; text-align: center; flex-shrink: 0; }
    .sidebar-bottom {
      padding: 16px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .user-info { margin-bottom: 12px; }
    .user-name { font-size: 13px; font-weight: 600; color: var(--white); margin-bottom: 4px; }
    .plan-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-free { background: rgba(136,136,136,0.2); color: var(--muted); }
    .badge-starter { background: rgba(59,130,246,0.2); color: #60a5fa; }
    .badge-pro { background: rgba(232,80,10,0.2); color: var(--orange); }
    .badge-admin { background: rgba(232,80,10,0.3); color: var(--orange); }
    .gen-counter {
      margin-top: 10px;
      margin-bottom: 12px;
    }
    .gen-counter-text {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .progress-bar {
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--orange);
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    .logout-btn {
      background: none; border: 1px solid var(--border);
      color: var(--muted); width: 100%; padding: 8px;
      border-radius: var(--radius); cursor: pointer;
      font-family: 'DM Sans', sans-serif; font-size: 13px;
      transition: all 0.15s;
    }
    .logout-btn:hover { border-color: #555; color: var(--white); }

    /* ---- Main content ---- */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px;
    }
    .page-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 42px;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }
    .page-subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 32px;
    }

    /* ---- Tool cards grid ---- */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }
    .tool-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      transition: border-color 0.2s;
      cursor: pointer;
    }
    .tool-card:hover { border-color: rgba(232,80,10,0.3); }
    .tool-card-icon {
      font-size: 24px;
      margin-bottom: 12px;
    }
    .tool-card-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 0.02em;
      margin-bottom: 6px;
    }
    .tool-card-desc {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .tool-card-locked {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .tool-card-locked:hover { border-color: var(--border); }
    .locked-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--muted);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      padding: 4px 10px; border-radius: 4px;
    }

    /* ---- Upgrade banner ---- */
    .upgrade-banner {
      background: linear-gradient(135deg, rgba(232,80,10,0.12), rgba(232,80,10,0.06));
      border: 1px solid rgba(232,80,10,0.3);
      border-radius: 10px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }
    .upgrade-banner-text strong {
      display: block;
      font-size: 15px;
      font-weight: 600;
      color: var(--white);
      margin-bottom: 2px;
    }
    .upgrade-banner-text span { font-size: 13px; color: var(--muted); }
    .upgrade-actions { display: flex; gap: 8px; flex-shrink: 0; }

    /* ---- Tool form ---- */
    .tool-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    .tool-form-grid .span-2 { grid-column: span 2; }
    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      margin-top: 24px;
    }
    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .result-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 0.02em;
    }
    .result-text {
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.7;
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
    }

    /* ---- Landing page ---- */
    .landing { min-height: 100vh; }

    .landing-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 60px;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(12px);
    }
    .landing-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 0.04em;
    }
    .landing-logo span { color: var(--orange); }
    .landing-nav-links {
      display: flex; align-items: center; gap: 32px;
      list-style: none;
    }
    .landing-nav-links a {
      color: var(--muted); font-size: 14px; font-weight: 500;
      transition: color 0.15s;
    }
    .landing-nav-links a:hover { color: var(--white); }
    .landing-nav-actions { display: flex; gap: 12px; align-items: center; }

    /* Hero */
    .hero {
      padding: 100px 60px 80px;
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
    }
    .hero-eyebrow {
      display: inline-block;
      font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--orange);
      background: rgba(232,80,10,0.1);
      border: 1px solid rgba(232,80,10,0.2);
      padding: 4px 14px; border-radius: 20px;
      margin-bottom: 28px;
    }
    .hero-headline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(52px, 8vw, 96px);
      letter-spacing: 0.02em;
      line-height: 0.95;
      margin-bottom: 24px;
      color: var(--white);
    }
    .hero-headline span { color: var(--orange); }
    .hero-sub {
      font-size: 18px;
      color: var(--muted);
      max-width: 560px;
      margin: 0 auto 40px;
      line-height: 1.65;
    }
    .hero-actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

    /* Tool cards on landing */
    .landing-tools {
      padding: 60px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .section-label {
      font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--orange); margin-bottom: 16px;
    }
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(32px, 4vw, 48px);
      letter-spacing: 0.02em;
      margin-bottom: 40px;
    }
    .landing-tools-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    .landing-tool-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 28px;
    }
    .landing-tool-card-number {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      color: rgba(232,80,10,0.2);
      line-height: 1;
      margin-bottom: 8px;
    }
    .landing-tool-card-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
    }
    .landing-tool-card-desc {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    /* Pricing */
    .pricing-section {
      padding: 80px 60px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    .pricing-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .pricing-card.popular {
      border-color: var(--orange);
      background: linear-gradient(160deg, #161616, #111111);
    }
    .popular-badge {
      position: absolute;
      top: -12px; left: 50%; transform: translateX(-50%);
      background: var(--orange);
      color: #fff;
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      padding: 4px 14px; border-radius: 20px;
    }
    .pricing-plan {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px; letter-spacing: 0.04em;
      margin-bottom: 8px; color: var(--muted);
    }
    .pricing-amount {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 52px; letter-spacing: -0.01em;
      line-height: 1;
      margin-bottom: 4px;
    }
    .pricing-period { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    .pricing-features { list-style: none; margin-bottom: 32px; flex: 1; }
    .pricing-features li {
      padding: 8px 0;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .pricing-features li:last-child { border-bottom: none; }
    .check { color: var(--orange); font-size: 12px; }

    /* Footer */
    .landing-footer {
      border-top: 1px solid var(--border);
      padding: 40px 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
    }

    /* Divider */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 0 60px;
    }

    /* Upgrade modal */
    .upgrade-modal-box {
      max-width: 480px;
    }
    .upgrade-modal-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
    }
    .upgrade-option {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
      text-decoration: none;
      transition: border-color 0.15s;
    }
    .upgrade-option:hover { border-color: var(--orange); }
    .upgrade-option-name { font-weight: 600; color: var(--white); font-size: 15px; }
    .upgrade-option-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .upgrade-option-price {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      color: var(--orange);
    }

    /* Welcome section */
    .welcome-greeting {
      margin-bottom: 32px;
    }
    .welcome-greeting h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      margin-bottom: 6px;
    }
    .welcome-greeting p { color: var(--muted); font-size: 14px; }

    /* Section header */
    .section-header { margin-bottom: 20px; }
    .section-header h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 0.02em;
    }

    @media (max-width: 900px) {
      .landing-nav { padding: 16px 24px; }
      .landing-nav-links { display: none; }
      .hero { padding: 60px 24px; }
      .landing-tools, .pricing-section { padding: 40px 24px; }
      .landing-tools-grid, .pricing-grid, .tools-grid { grid-template-columns: 1fr; }
      .main-content { padding: 20px; }
      .tool-form-grid { grid-template-columns: 1fr; }
      .tool-form-grid .span-2 { grid-column: span 1; }
      .sidebar { display: none; }
      .landing-footer { flex-direction: column; gap: 12px; text-align: center; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // ---------------------------------------------------------------------------
    // API helpers
    // ---------------------------------------------------------------------------
    const API = {
      async call(path, method = 'GET', body = null, token = null) {
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        const opts = { method, headers };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(path, opts);
        const data = await res.json();
        return { ok: res.ok, status: res.status, data };
      }
    };

    // ---------------------------------------------------------------------------
    // Plan helpers
    // ---------------------------------------------------------------------------
    const FREE_LIMIT = 5;

    function canUseTool(user, toolKey) {
      if (!user) return false;
      if (user.is_admin) return true;
      const plan = user.plan || 'free';
      if (plan === 'pro') return true;
      if (plan === 'free' || plan === 'starter') return toolKey === 'proposal';
      return false;
    }

    function getPlanBadgeClass(plan, isAdmin) {
      if (isAdmin || plan === 'admin') return 'badge-admin';
      if (plan === 'pro') return 'badge-pro';
      if (plan === 'starter') return 'badge-starter';
      return 'badge-free';
    }

    // ---------------------------------------------------------------------------
    // Spinner
    // ---------------------------------------------------------------------------
    function Spinner() {
      return <div className="spinner" />;
    }

    // ---------------------------------------------------------------------------
    // Login Modal
    // ---------------------------------------------------------------------------
    function LoginModal({ onClose, onSuccess, onSwitchToRegister }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      async function handleSubmit(e) {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          const { ok, data } = await API.call('/api/auth/login', 'POST', { email, password });
          if (!ok) { setError(data.error || 'Login failed'); return; }
          localStorage.setItem('rd_token', data.token);
          onSuccess(data.user, data.token);
        } catch (err) {
          setError('Connection error — please try again');
        } finally {
          setLoading(false);
        }
      }

      return (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
          <div className="modal-box">
            <div className="modal-title">Welcome Back</div>
            <div className="modal-subtitle">Sign in to your RoofDraft AI account</div>
            <form className="modal-form" onSubmit={handleSubmit}>
              {error && <div className="modal-error">{error}</div>}
              <div className="form-group">
                <label className="form-label">Email</label>
                <input className="form-input" type="email" value={email}
                  onChange={e => setEmail(e.target.value)} placeholder="you@company.com" required />
              </div>
              <div className="form-group">
                <label className="form-label">Password</label>
                <input className="form-input" type="password" value={password}
                  onChange={e => setPassword(e.target.value)} placeholder="••••••••" required />
              </div>
              <button className="btn btn-primary btn-full" type="submit" disabled={loading}>

        { key: 'followup', label: 'Follow-Up Email',    icon: '📧' },
        { key: 'review',   label: 'Review Request',     icon: '⭐' },
        { key: 'referral', label: 'Referral Message',   icon: '🤝' },
      ];

      return (
        <div className="sidebar">
          <div className="sidebar-logo">
            <div className="sidebar-logo-text">Roof<span>Draft</span> AI</div>
          </div>
          <nav className="sidebar-nav">
            {navItems.map(item => {
              const accessible = item.key === 'home' || item.key === 'proposal' || canUseTool(user, item.key);
              return (
                <button
                  key={item.key}
                  className={`nav-item${activeTab === item.key ? ' active' : ''}`}
                  onClick={() => accessible && onSelectTab(item.key)}
                  style={!accessible ? { opacity: 0.4, cursor: 'not-allowed' } : {}}
                >
                  <span className="nav-icon">{item.icon}</span>
                  {item.label}
                  {!accessible && <span style={{ marginLeft: 'auto', fontSize: '10px' }}>PRO</span>}
                </button>
              );
            })}
          </nav>
          <div className="sidebar-bottom">
            <div className="user-info">
              <div className="user-name">{user.username}</div>
              <span className={`plan-badge ${getPlanBadgeClass(user.plan, user.is_admin)}`}>
                {user.is_admin ? 'Admin' : (user.plan || 'free').charAt(0).toUpperCase() + (user.plan || 'free').slice(1)}
              </span>
            </div>
            {isFree && (
              <div className="gen-counter">
                <div className="gen-counter-text">{genCount} of {FREE_LIMIT} free generations used</div>
                <div className="progress-bar">
                  <div className="progress-fill" style={{ width: `${pct}%` }} />
                </div>
              </div>
            )}
            <button className="logout-btn" onClick={onLogout}>Sign Out</button>
          </div>
        </div>
      );
    }

    // ---------------------------------------------------------------------------
    // Dashboard (logged in)
    // ---------------------------------------------------------------------------
    function Dashboard({ user, token, onLogout, onUserUpdate }) {
      const [activeTab, setActiveTab] = useState('home');
      const [showUpgrade, setShowUpgrade] = useState(false);

      function handleUpgradeNeeded() {
        setShowUpgrade(true);
      }

      const toolProps = { token, onUpgradeNeeded: handleUpgradeNeeded };

      return (
        <div className="dashboard">
          <Sidebar user={user} activeTab={activeTab} onSelectTab={setActiveTab} onLogout={onLogout} />
          <main className="main-content">
            {activeTab === 'home'     && <DashboardHome user={user} onSelectTab={setActiveTab} />}
            {activeTab === 'proposal' && <ProposalTool {...toolProps} />}
            {activeTab === 'followup' && <FollowUpTool {...toolProps} />}
            {activeTab === 'review'   && <ReviewTool {...toolProps} />}
            {activeTab === 'referral' && <ReferralTool {...toolProps} />}
          </main>
          {showUpgrade && <UpgradeModal onClose={() => setShowUpgrade(false)} />}
        </div>
      );
    }

    // ---------------------------------------------------------------------------
    // Landing Page
    // ---------------------------------------------------------------------------
    function LandingPage({ onShowLogin, onShowRegister }) {
      const tools = [
        { num: '01', name: 'Proposal Generator', desc: 'Complete, professional proposal letters that win jobs. Fill out the job details and get a client-ready document in under 60 seconds.' },
        { num: '02', name: 'Follow-Up Email', desc: '3 variations of follow-up emails for prospects who haven\'t responded. Human tone, no pressure, one clear call to action.' },
        { num: '03', name: 'Review Request', desc: 'A text and email version of a Google review ask — personal and natural, not a corporate template.' },
        { num: '04', name: 'Referral Message', desc: 'Ask happy customers for referrals without being awkward. Text and email versions, with optional incentive mention.' },
      ];

      const plans = [
        {
          name: 'Free',
          price: '$0',
          period: 'forever',
          features: ['5 generations per month', 'Proposal Generator only', 'No credit card required'],
          popular: false,
        },
        {
          name: 'Starter',
          price: '$49',
          period: 'per month',
          features: ['Unlimited generations', 'Proposal Generator', 'Priority support'],
          popular: false,
        },
        {
          name: 'Pro',
          price: '$79',
          period: 'per month',
          features: ['Unlimited generations', 'All 4 tools', 'Follow-Up Email', 'Review Request', 'Referral Message'],
          popular: true,
        },
      ];

      return (
        <div className="landing">
          {/* Nav */}
          <nav className="landing-nav">
            <div className="landing-logo">Roof<span>Draft</span> AI</div>
            <ul className="landing-nav-links">
              <li><a href="#tools">Tools</a></li>
              <li><a href="#pricing">Pricing</a></li>
            </ul>
            <div className="landing-nav-actions">
              <button className="btn btn-ghost" onClick={onShowLogin} style={{ padding: '9px 20px', fontSize: '14px' }}>Log In</button>
              <button className="btn btn-primary" onClick={onShowRegister} style={{ padding: '9px 20px', fontSize: '14px' }}>Start Free Trial</button>
            </div>
          </nav>

          {/* Hero */}
          <section className="hero">
            <div className="hero-eyebrow">AI-Powered Roofing Tools</div>
            <h1 className="hero-headline">
              Write Roofing<br />
              Proposals In<br />
              <span>60 Seconds.</span>
            </h1>
            <p className="hero-sub">
              Stop losing jobs to competitors with better paperwork. Fill out a form, get a professional proposal instantly.
            </p>
            <div className="hero-actions">
              <button className="btn btn-primary" onClick={onShowRegister} style={{ padding: '14px 28px', fontSize: '15px' }}>
                Start Free — No Card Needed
              </button>
              <a href="#tools" className="btn btn-ghost" style={{ padding: '14px 28px', fontSize: '15px' }}>
                See The Tools
              </a>
            </div>
          </section>

          <hr className="divider" />

          {/* Tools */}
          <section id="tools" className="landing-tools">
            <div className="section-label">What's Inside</div>
            <h2 className="section-title">Four tools built for<br />roofing contractors</h2>
            <div className="landing-tools-grid">
              {tools.map(t => (
                <div key={t.num} className="landing-tool-card">
                  <div className="landing-tool-card-number">{t.num}</div>
                  <div className="landing-tool-card-name">{t.name}</div>
                  <div className="landing-tool-card-desc">{t.desc}</div>
                </div>
              ))}
            </div>
          </section>

          <hr className="divider" />

          {/* Pricing */}
          <section id="pricing" className="pricing-section">
            <div className="section-label">Pricing</div>
            <h2 className="section-title">Simple, transparent pricing</h2>
            <div className="pricing-grid">
              {plans.map(plan => (
                <div key={plan.name} className={`pricing-card${plan.popular ? ' popular' : ''}`}>
                  {plan.popular && <div className="popular-badge">Most Popular</div>}
                  <div className="pricing-plan">{plan.name}</div>
                  <div className="pricing-amount">{plan.price}</div>
                  <div className="pricing-period">{plan.period}</div>
                  <ul className="pricing-features">
                    {plan.features.map(f => (
                      <li key={f}><span className="check">✦</span>{f}</li>
                    ))}
                  </ul>
                  <button
                    className={`btn ${plan.popular ? 'btn-primary' : 'btn-ghost'} btn-full`}
                    onClick={onShowRegister}
                  >
                    Get Started
                  </button>
                </div>
              ))}
            </div>
          </section>

          {/* Footer */}
          <footer className="landing-footer">
            <div className="landing-logo" style={{ fontSize: '16px' }}>Roof<span style={{ color: 'var(--orange)' }}>Draft</span> AI</div>
            <div>Built for roofing contractors who want to win more jobs.</div>
            <div>© {new Date().getFullYear()} RoofDraft AI. All rights reserved.</div>
          </footer>
        </div>
      );
    }

    // ---------------------------------------------------------------------------
    // App Root
    // ---------------------------------------------------------------------------
    function App() {
      const [user, setUser] = useState(null);
      const [token, setToken] = useState(null);
      const [loading, setLoading] = useState(true);
      const [modal, setModal] = useState(null); // 'login' | 'register' | null

      useEffect(() => {
        const stored = localStorage.getItem('rd_token');
        if (!stored) { setLoading(false); return; }
        API.call('/api/auth/me', 'GET', null, stored).then(({ ok, data }) => {
          if (ok) {
            setUser(data);
            setToken(stored);
          } else {
            localStorage.removeItem('rd_token');
          }
          setLoading(false);
        }).catch(() => setLoading(false));
      }, []);

      function handleAuthSuccess(userData, newToken) {
        setUser(userData);
        setToken(newToken);
        setModal(null);
      }

      function handleLogout() {
        if (token) {
          API.call('/api/auth/logout', 'POST', null, token).catch(() => {});
        }
        localStorage.removeItem('rd_token');
        setUser(null);
        setToken(null);
      }

      if (loading) {
        return (
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', gap: '12px' }}>
            <Spinner />
            <span style={{ color: 'var(--muted)', fontSize: '14px' }}>Loading...</span>
          </div>
        );
      }

      return (
        <>
          {user ? (
            <Dashboard
              user={user}
              token={token}
              onLogout={handleLogout}
              onUserUpdate={setUser}
            />
          ) : (
            <LandingPage
              onShowLogin={() => setModal('login')}
              onShowRegister={() => setModal('register')}
            />
          )}

          {modal === 'login' && (
            <LoginModal
              onClose={() => setModal(null)}
              onSuccess={handleAuthSuccess}
              onSwitchToRegister={() => setModal('register')}
            />
          )}
          {modal === 'register' && (
            <RegisterModal
              onClose={() => setModal(null)}
              onSuccess={handleAuthSuccess}
              onSwitchToLogin={() => setModal('login')}
            />
          )}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
