                <a href="mailto:owen.murillo2533@gmail.com?subject=Upgrade Request — Pro Plan"
                  className="btn btn-primary btn-sm"
                  style={{ fontFamily:'Oswald, sans-serif', letterSpacing:'0.03em', textTransform:'uppercase' }}>
                  Upgrade to Pro — $79/mo
                </a>
              </div>
            </div>
          </div>
        );
      }

      const FOLDER_COLORS = ['#C0392B','#4A5568','#D4A853','#27AE60','#2C2825','#718096'];

      const [folders, setFolders] = useState([]);
      const [selectedFolder, setSelectedFolder] = useState('all');
      const [drafts, setDrafts] = useState([]);
      const [loadingDrafts, setLoadingDrafts] = useState(true);
      const [showNewFolder, setShowNewFolder] = useState(false);
      const [newFolderName, setNewFolderName] = useState('');
      const [newFolderColor, setNewFolderColor] = useState('#C0392B');
      const [creatingFolder, setCreatingFolder] = useState(false);
      const [renamingId, setRenamingId] = useState(null);
      const [renameVal, setRenameVal] = useState('');
      const [viewingDraft, setViewingDraft] = useState(null);
      const [movingDraftId, setMovingDraftId] = useState(null);
      const [moveFolderVal, setMoveFolderVal] = useState('');
      const [copied, setCopied] = useState(false);

      useEffect(() => {
        loadFolders();
        loadDrafts('all');
      }, []);

      async function loadFolders() {
        const { ok, data } = await API.call('/api/folders', 'GET', null, token);
        if (ok) setFolders(data.folders || []);
      }

      async function loadDrafts(fId) {
        setLoadingDrafts(true);
        const url = fId === 'all' ? '/api/drafts' : `/api/drafts?folder_id=${fId}`;
        const { ok, data } = await API.call(url, 'GET', null, token);
        if (ok) setDrafts(data.drafts || []);
        setLoadingDrafts(false);
      }

      async function handleSelectFolder(fId) {
        setSelectedFolder(fId);
        await loadDrafts(fId);
      }

      async function handleCreateFolder(e) {
        e.preventDefault();
        if (!newFolderName.trim()) return;
        setCreatingFolder(true);
        const { ok, data } = await API.call('/api/folders', 'POST', { name: newFolderName.trim(), color: newFolderColor }, token);
        setCreatingFolder(false);
        if (ok) {
          setFolders(f => [...f, { ...data.folder, draft_count: 0 }]);
          setNewFolderName('');
          setShowNewFolder(false);
        }
      }

      async function handleDeleteFolder(fId) {
        if (!window.confirm('Delete this folder? Drafts inside will become unfiled.')) return;
        await API.call(`/api/folders/${fId}`, 'DELETE', null, token);
        setFolders(f => f.filter(x => x.id !== fId));
        if (selectedFolder === fId) { setSelectedFolder('all'); loadDrafts('all'); }
      }

      async function handleRenameFolder(fId) {
        if (!renameVal.trim()) { setRenamingId(null); return; }
        await API.call(`/api/folders/${fId}`, 'PATCH', { name: renameVal.trim() }, token);
        setFolders(f => f.map(x => x.id === fId ? { ...x, name: renameVal.trim() } : x));
        setRenamingId(null);
      }

      async function handleOpenDraft(draft) {
        const { ok, data } = await API.call(`/api/drafts/${draft.id}`, 'GET', null, token);
        if (ok) setViewingDraft(data.draft);
      }

      async function handleDeleteDraft(e, dId) {
        e.stopPropagation();
        if (!window.confirm('Delete this draft?')) return;
        await API.call(`/api/drafts/${dId}`, 'DELETE', null, token);
        setDrafts(d => d.filter(x => x.id !== dId));
      }

      async function handleMoveDraft(dId) {
        const fId = moveFolderVal === '' ? null : parseInt(moveFolderVal);
        await API.call(`/api/drafts/${dId}`, 'PATCH', { folder_id: fId }, token);
        setMovingDraftId(null);
        loadDrafts(selectedFolder);
      }

      const selectedFolderName = selectedFolder === 'all' ? 'All Drafts' : (folders.find(f => f.id === selectedFolder)?.name || 'Drafts');

      return (
        <div>
          <div className="page-title">Job Folders</div>
          <div className="page-subtitle">Organize your saved content by client or job site.</div>
          <div className="folders-layout">

            {/* Left panel */}
            <div className="folders-left">
              <div className="folders-left-header">
                <div className="folders-left-title">My Folders</div>
                <button className="btn btn-primary btn-sm" style={{ padding:'7px 12px', fontSize:'13px' }}
                  onClick={() => setShowNewFolder(s => !s)}>+ New</button>
              </div>

              {showNewFolder && (
                <form className="new-folder-form" onSubmit={handleCreateFolder}>
                  <input className="form-input" type="text" placeholder="Folder name"
                    value={newFolderName} onChange={e => setNewFolderName(e.target.value)} required autoFocus
                    style={{ fontSize:'14px', padding:'8px 10px' }} />
                  <div className="folder-color-row">
                    <span style={{ fontSize:'12px', color:'var(--slate)', fontWeight:600, marginRight:2 }}>Color:</span>
                    {FOLDER_COLORS.map(c => (
                      <button key={c} type="button"
                        className={`folder-color-dot${newFolderColor === c ? ' selected' : ''}`}
                        style={{ background: c }}
                        onClick={() => setNewFolderColor(c)} />
                    ))}
                  </div>
                  <button className="btn btn-primary btn-sm btn-full" type="submit" disabled={creatingFolder}>
                    {creatingFolder ? 'Creating...' : 'Create Folder'}
                  </button>
                </form>
              )}

              <button
                className={`folder-all-btn${selectedFolder === 'all' ? ' active' : ''}`}
                onClick={() => handleSelectFolder('all')}
              >
                <span style={{ fontSize:'15px' }}>◻</span>
                <span className="folder-row-name">All Drafts</span>
              </button>

              {folders.map(f => (
                <div key={f.id} className={`folder-row${selectedFolder === f.id ? ' active' : ''}`}>
                  {renamingId === f.id ? (
                    <div className="folder-rename-inline">
                      <input className="form-input" style={{ padding:'6px 8px', fontSize:'13px', flex:1 }}
                        value={renameVal} onChange={e => setRenameVal(e.target.value)} autoFocus
                        onKeyDown={e => { if (e.key === 'Enter') handleRenameFolder(f.id); if (e.key === 'Escape') setRenamingId(null); }} />
                      <button className="btn btn-sm btn-primary" style={{ padding:'6px 10px', fontSize:'12px', flexShrink:0 }}
                        onClick={() => handleRenameFolder(f.id)}>✓</button>
                    </div>
                  ) : (
                    <button className="folder-row-inner" onClick={() => handleSelectFolder(f.id)}>
                      <span className="folder-color-bar" style={{ background: f.color }} />
                      <span className="folder-row-name">{f.name}</span>
                      <span className="folder-row-count">{f.draft_count}</span>
                      <div className="folder-row-actions">
                        <button className="folder-action-btn" title="Rename"
                          onClick={e => { e.stopPropagation(); setRenamingId(f.id); setRenameVal(f.name); }}>✎</button>
                        <button className="folder-action-btn danger" title="Delete"
                          onClick={e => { e.stopPropagation(); handleDeleteFolder(f.id); }}>✕</button>
                      </div>
                    </button>
                  )}
                </div>
              ))}
            </div>

            {/* Right panel */}
            <div className="folders-right">
              <div className="folders-right-header">
                <div className="folders-right-title">{selectedFolderName}</div>
                <div className="folders-right-count">{drafts.length} draft{drafts.length !== 1 ? 's' : ''}</div>
              </div>
              {loadingDrafts ? (
                <div style={{ display:'flex', alignItems:'center', gap:12, padding:'40px 20px', color:'var(--slate)' }}>
                  <Spinner dark /><span>Loading...</span>
                </div>
              ) : drafts.length === 0 ? (
                <div className="drafts-empty" style={{ paddingTop:40 }}>
                  <div className="drafts-empty-icon">◻</div>
                  <h3>No drafts here yet</h3>
                  <p>Generate content from any tool, then use "Save to Folder" to store it here.</p>
                </div>
              ) : (
                <div className="folders-drafts-list">
                  {drafts.map(d => (
                    <div key={d.id} className="folder-draft-card">
                      <div className="folder-draft-main" onClick={() => handleOpenDraft(d)}>
                        <span className="draft-tool-badge">{TOOL_LABELS[d.tool_name] || d.tool_name}</span>
                        <div className="folder-draft-info">
                          <div className="folder-draft-title">{d.title}</div>
                          <div className="draft-date">{formatDate(d.created_at)}</div>
                        </div>
                      </div>
                      <div className="folder-draft-actions">
                        {movingDraftId === d.id ? (
                          <div className="move-folder-inline">
                            <select className="form-select" style={{ padding:'5px 28px 5px 8px', fontSize:'13px' }}
                              value={moveFolderVal} onChange={e => setMoveFolderVal(e.target.value)}>
                              <option value="">Unfiled</option>
                              {folders.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
                            </select>
                            <button className="btn btn-sm btn-primary" style={{ padding:'5px 10px', fontSize:'12px' }}
                              onClick={() => handleMoveDraft(d.id)}>Move</button>
                            <button className="btn btn-sm btn-ghost" style={{ padding:'5px 8px', fontSize:'12px' }}
                              onClick={() => setMovingDraftId(null)}>✕</button>
                          </div>
                        ) : (
                          <>
                            <button className="draft-delete-btn"
                              onClick={() => { setMovingDraftId(d.id); setMoveFolderVal(d.folder_id ? String(d.folder_id) : ''); }}>
                              Move
                            </button>
                            <button className="draft-delete-btn" onClick={e => handleDeleteDraft(e, d.id)}>Delete</button>
                          </>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>

          {/* Draft viewer modal */}
          {viewingDraft && (
            <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setViewingDraft(null)}>
              <div className="modal-box" style={{ maxWidth:'680px', maxHeight:'85vh', display:'flex', flexDirection:'column' }}>
                <button className="modal-close" onClick={() => setViewingDraft(null)}>✕</button>
                <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:12 }}>
                  <span className="draft-tool-badge">{TOOL_LABELS[viewingDraft.tool_name] || viewingDraft.tool_name}</span>
                  <span className="draft-date">{formatDate(viewingDraft.created_at)}</span>
                </div>
                <div className="modal-title" style={{ fontSize:'20px', marginBottom:14 }}>{viewingDraft.title}</div>
                <div style={{ flex:1, overflowY:'auto', borderTop:'1px solid var(--border)', paddingTop:16 }}>
                  <div className="result-text">{viewingDraft.result}</div>
                </div>
                <div style={{ paddingTop:14, borderTop:'1px solid var(--border)', marginTop:14 }}>
                  <button
                    className={`btn btn-sm btn-outline-red${copied ? ' copy-btn-success' : ''} btn-full`}
                    onClick={() => {
                      navigator.clipboard.writeText(viewingDraft.result).then(() => {
                        setCopied(true); setTimeout(() => setCopied(false), 2000);
                      });
                    }}>
                    {copied ? '✓ Copied!' : 'Copy to Clipboard'}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ---------------------------------------------------------------------------
    // Feature Comparison Modal
    // ---------------------------------------------------------------------------
    function FeatureComparisonModal({ user, onClose }) {
      const plan = user.is_admin ? 'pro' : (user.plan || 'free');
      const FEATURES = [
        ['Monthly proposals', '5/mo', 'Unlimited', 'Unlimited'],
        ['Proposal Generator', true, true, true],

        ['Saved company defaults', false, true, true],
        ['Job Folders', false, false, true],
        ['Support', 'Community', 'Email', 'Priority'],

      function cell(v) {
        if (v === true)  return <span className="compare-check">✓</span>;
        if (v === false) return <span className="compare-x">✗</span>;
        return <span style={{ fontSize:'13px', color:'var(--charcoal)' }}>{v}</span>;
      }
      const planLabel = user.is_admin ? 'Admin (Pro)' : plan.charAt(0).toUpperCase() + plan.slice(1);
      return (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
          <div className="modal-box" style={{ maxWidth:'560px', maxHeight:'85vh', overflowY:'auto' }}>
            <button className="modal-close" onClick={onClose}>✕</button>
            <div className="modal-title">Plan Features</div>
            <div className="modal-subtitle">You're on the <strong>{planLabel}</strong> plan</div>
            <table style={{ width:'100%', borderCollapse:'collapse', marginTop:16, fontSize:14 }}>
              <thead>
                <tr>
                  <th style={{ textAlign:'left', padding:'9px 0', borderBottom:'2px solid var(--border)', color:'var(--slate)', fontSize:'12px', textTransform:'uppercase', letterSpacing:'0.06em' }}>Feature</th>
                  {['Free','Starter','Pro'].map(p => (
                    <th key={p} style={{ textAlign:'center', padding:'9px 8px', borderBottom:'2px solid var(--border)', fontSize:'12px', textTransform:'uppercase', letterSpacing:'0.06em', color: p.toLowerCase() === plan || (user.is_admin && p === 'Pro') ? 'var(--roof-red)' : 'var(--slate)' }}>{p}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {FEATURES.map(([label, free, starter, pro]) => (
                  <tr key={label}>
                    <td style={{ padding:'9px 0', borderBottom:'1px solid var(--light-gray)', color:'var(--charcoal)' }}>{label}</td>
                    <td style={{ textAlign:'center', padding:'9px 8px', borderBottom:'1px solid var(--light-gray)' }}>{cell(free)}</td>
                    <td style={{ textAlign:'center', padding:'9px 8px', borderBottom:'1px solid var(--light-gray)' }}>{cell(starter)}</td>
                    <td style={{ textAlign:'center', padding:'9px 8px', borderBottom:'1px solid var(--light-gray)' }}>{cell(pro)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            {plan !== 'pro' && !user.is_admin && (
              <div style={{ marginTop:20 }}>
                {/* STRIPE: replace this mailto link with Stripe checkout session call for pro plan */}
                <a href="mailto:owen.murillo2533@gmail.com?subject=Upgrade Request — Pro Plan"
                  className="btn btn-primary btn-full"
                  style={{ fontFamily:'Oswald, sans-serif', letterSpacing:'0.03em', textTransform:'uppercase' }}>
                  Upgrade to Pro — $79/mo
                </a>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ---------------------------------------------------------------------------
    // Sidebar
    // ---------------------------------------------------------------------------
    function Sidebar({ user, activeTab, onSelectTab, onLogout, onShowFeatures, mobileOpen, onMobileClose }) {
      const isFree = user.plan === 'free' && !user.is_admin;
      const genCount = user.generations_this_month || 0;
      const pct = isFree ? Math.min(100, (genCount / FREE_LIMIT) * 100) : 0;

      const isPaying = user.is_admin || user.plan === 'starter' || user.plan === 'pro';
      const isPro = user.is_admin || user.plan === 'pro';
      const navItems = [
        { key: 'home',     label: 'Dashboard',          icon: '▦', always: true },
        { key: 'proposal', label: 'Proposal Generator', icon: '◻', always: true },
        { key: 'followup', label: 'Follow-Up Email',    icon: '✉', always: false },
        { key: 'review',   label: 'Review Request',     icon: '★', always: false },
        { key: 'referral', label: 'Referral Message',   icon: '↗', always: false },
        ...(isPaying ? [{ key: 'drafts', label: 'Saved Drafts', icon: '⊟', always: true }] : []),
        { key: 'folders',  label: 'Job Folders',        icon: '◈', always: isPro, proOnly: !isPro },
        { key: 'defaults', label: 'My Defaults',        icon: '⚙', always: true },
        ...(user.is_admin ? [{ key: 'admin', label: 'Admin', icon: '▤', always: true }] : []),
      ];

      return (
        <div className={`sidebar${mobileOpen ? ' mobile-open' : ''}`}>
          <div className="sidebar-logo" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div className="sidebar-logo-text">Roof<span>Draft</span></div>
            {onMobileClose && (
              <button onClick={onMobileClose} style={{ background:'none', border:'none', cursor:'pointer', fontSize:'20px', color:'var(--slate-light)', padding:'4px', lineHeight:1 }} aria-label="Close menu">✕</button>
            )}
          </div>
          <nav className="sidebar-nav">
            {navItems.map(item => {
              const accessible = item.always || canUseTool(user, item.key);
              return (
                <button
                  key={item.key}
                  className={`nav-item${activeTab === item.key ? ' active' : ''}`}
                  onClick={() => accessible && onSelectTab(item.key)}
                  style={!accessible ? { opacity: 0.45, cursor: 'default' } : {}}
                >
                  <span className="nav-icon">{item.icon}</span>
                  {item.label}
                  {(!accessible || item.proOnly) && <span style={{ marginLeft: 'auto', fontSize: '10px', fontWeight: 700, color: 'var(--slate-light)', letterSpacing: '0.06em' }}>PRO</span>}
                </button>
              );
            })}
          </nav>
          <div className="sidebar-bottom">
            <div className="user-info">
              <div className="user-name">{user.username}</div>
              <span className={`plan-badge ${getPlanBadgeClass(user.plan, user.is_admin)}`}>
                {user.is_admin ? 'Admin' : (user.plan || 'free').charAt(0).toUpperCase() + (user.plan || 'free').slice(1)}
              </span>
              {onShowFeatures && (
                <button className="features-link" onClick={onShowFeatures}>
                  What's included on my plan?
                </button>
              )}
            </div>
            {isFree && (
              <div className="gen-counter">
                <div className="gen-counter-label">{genCount} of {FREE_LIMIT} free generations used</div>
                <div className="progress-bar">
                  <div className="progress-fill" style={{ width: `${pct}%` }} />
                </div>
              </div>
            )}
            <button className="logout-btn" onClick={onLogout}>Sign Out</button>
          </div>
        </div>
      );
    }

          <main className="main-content">

            {activeTab === 'followup' && <FollowUpTool {...toolProps} />}

            {activeTab === 'referral' && <ReferralTool {...toolProps} />}

        </div>
      );
    }

    function App() {
      const [user, setUser] = useState(null);
      const [token, setToken] = useState(null);
      const [loading, setLoading] = useState(true);
      const [modal, setModal] = useState(null);

      console.log('App render — loading:', loading, 'user:', !!user);

      useEffect(() => {
        const stored = localStorage.getItem('rd_token');
        if (!stored) { setLoading(false); return; }
        API.call('/api/auth/me', 'GET', null, stored).then(({ ok, data }) => {
          if (ok) { setUser(data); setToken(stored); }
          else { localStorage.removeItem('rd_token'); }
          setLoading(false);
        }).catch(() => setLoading(false));
      }, []);

      function handleAuthSuccess(userData, newToken) {
        setUser(userData);
        setToken(newToken);
        setModal(null);
      }

      function handleLogout() {
        if (token) { API.call('/api/auth/logout', 'POST', null, token).catch(() => {}); }
        localStorage.removeItem('rd_token');
        setUser(null);
        setToken(null);
      }

      if (loading) {
        return (
          <div className="loading-screen">
            <Spinner dark />
            <span>Loading...</span>
          </div>
        );
      }

      return (
        <>
          {user ? (
            <Dashboard user={user} token={token} onLogout={handleLogout} onUserUpdate={setUser} />
          ) : (
            <LandingPage onShowLogin={() => setModal('login')} onShowRegister={() => setModal('register')} />
          )}

          {modal === 'login' && (
            <LoginModal onClose={() => setModal(null)} onSuccess={handleAuthSuccess} onSwitchToRegister={() => setModal('register')} />
          )}
          {modal === 'register' && (
            <RegisterModal onClose={() => setModal(null)} onSuccess={handleAuthSuccess} onSwitchToLogin={() => setModal('login')} />
          )}
        </>
      );
    }
